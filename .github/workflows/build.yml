name: Build and Test (.NET + Next.js)

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # ===============================
  # 1️⃣ BUILD & TEST BACKEND (.NET)
  # ===============================
  backend:
    name: Build & Test .NET API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Tekno.sln

      - name: Build solution
        run: dotnet build Tekno.sln --configuration Release --no-restore

      - name: Run tests (if any)
        run: dotnet test Tekno.sln --no-build --verbosity normal

