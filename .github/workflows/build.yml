name: Build and Test (.NET)

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Add NuGet feed
        run: dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org

      - name: Restore
        run: dotnet restore Tekno.sln

      - name: Build
        run: dotnet build Tekno.sln --configuration Release --no-restore

      - name: Test Domain layer
        run: dotnet test Tests/Domain.Tests/Domain.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Test Application layer
        run: dotnet test Tests/Application.Tests/Application.Tests.csproj --configuration Release --no-restore --verbosity normal
