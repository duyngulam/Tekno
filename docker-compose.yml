services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env  # Load environment variables from .env file
    environment:
      # Database (can override .env values here)
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Host=db;Database=tekno;Username=postgres;Password=postgres}
      
      # Redis
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING:-redis:6379}
      - Redis__InstanceName=${REDIS_INSTANCE_NAME:-Tekno_}
      
      # Elasticsearch
      - ElasticSearch__Uri=${ELASTICSEARCH_URI:-http://elasticsearch:9200}
      - ElasticSearch__IndexName=${ELASTICSEARCH_INDEX_NAME:-products}
      
      # Cloudinary (loads from .env file)
      - Cloudinary__Url=${CLOUDINARY_URL}
      
      # JWT
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-ThisIsAVeryMysteriousKeyProtectItPlease}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      
      # Environment
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - DOTNET_ENVIRONMENT=${DOTNET_ENVIRONMENT:-Development}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # db:
  #   image: postgres:16
  #   container_name: tekno-db
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #     POSTGRES_DB: ${POSTGRES_DB:-tekno}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  redis:
    image: redis:7-alpine
    container_name: tekno-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  # db_data:
  esdata:
  redis_data:
